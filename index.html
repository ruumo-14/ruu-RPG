<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111b">
  <meta name="description" content="Ruu RPG - ドット絵の弾幕回避ゲーム">
  <title>Ruu RPG</title>
  <link rel="stylesheet" href="rpg.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="Ruu RPG のゲーム画面"></canvas>
    <div id="rotate-note">横向き画面がおすすめです</div>
    <div id="touch-controls" aria-label="タッチ操作">
      <div id="dpad" aria-label="移動操作">
        <button data-dir="up" aria-label="上へ">▲</button>
        <div class="dpad-middle">
          <button data-dir="left" aria-label="左へ">◀</button>
          <button data-dir="down" aria-label="下へ">▼</button>
          <button data-dir="right" aria-label="右へ">▶</button>
        </div>
      </div>
      <button id="touch-start">START</button>
    </div>
  </main>
  <script src="rpg.js"></script>
</body>
</html>
